<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CS24 Roadmap Tracker</title>

<style>
/* Layout concept: left rail (nav, name, sync state) + one working column.
   Dashboard reads as a pipeline: seven stages, each module a status-coloured chip. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#F5F7FA; --line:#D6DDE7; --line2:#E6EAF0;
  --fg:#121C2A; --muted:#566377; --accent:#0A7EA4; --accent-ink:#FFFFFF; --accent-soft:#DAEEF6;
  --code-bg:#EAEFF5;
  --s-AVAILABLE-bg:#E3E8EF; --s-AVAILABLE-fg:#3A485E; --s-AVAILABLE-solid:#8796AC;
  --s-BLOCKED-bg:#FBE2DF;   --s-BLOCKED-fg:#9B2A22;   --s-BLOCKED-solid:#D4504A;
  --s-CLAIMED-bg:#E8E2FA;   --s-CLAIMED-fg:#5535AE;   --s-CLAIMED-solid:#7C5CD6;
  --s-IN_PROGRESS-bg:#DBEAF9; --s-IN_PROGRESS-fg:#0B57A3; --s-IN_PROGRESS-solid:#2F7FD1;
  --s-REVIEW-bg:#FAEED0;    --s-REVIEW-fg:#875700;    --s-REVIEW-solid:#D9981A;
  --s-COMPLETED-bg:#D8F1E2; --s-COMPLETED-fg:#17653A; --s-COMPLETED-solid:#2E9E62;
  --p-Critical:#C8443D; --p-High:#D9801B; --p-Medium:#3D86D6; --p-Low:#8796AC;
  --shadow:0 8px 28px rgba(18,28,42,.14);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B121B; --surface:#121C28; --surface2:#172333; --line:#27374A; --line2:#1D2B3C;
  --fg:#E6ECF4; --muted:#93A2B7; --accent:#3DB8E4; --accent-ink:#06202B; --accent-soft:#123244;
  --code-bg:#0E1722;
  --s-AVAILABLE-bg:#1F2C3C; --s-AVAILABLE-fg:#B4C2D6; --s-AVAILABLE-solid:#6B7C93;
  --s-BLOCKED-bg:#3A1D1F;   --s-BLOCKED-fg:#FFA39B;   --s-BLOCKED-solid:#F0706A;
  --s-CLAIMED-bg:#2A2347;   --s-CLAIMED-fg:#C6B5FF;   --s-CLAIMED-solid:#9A82F0;
  --s-IN_PROGRESS-bg:#16304D; --s-IN_PROGRESS-fg:#92C8FF; --s-IN_PROGRESS-solid:#4D9BEA;
  --s-REVIEW-bg:#3B2E12;    --s-REVIEW-fg:#F4CB74;    --s-REVIEW-solid:#E8B341;
  --s-COMPLETED-bg:#123424; --s-COMPLETED-fg:#84D9A6; --s-COMPLETED-solid:#46C07F;
  --p-Critical:#F0706A; --p-High:#F0A04B; --p-Medium:#6BAAF0; --p-Low:#6B7C93;
  --shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B121B; --surface:#121C28; --surface2:#172333; --line:#27374A; --line2:#1D2B3C;
  --fg:#E6ECF4; --muted:#93A2B7; --accent:#3DB8E4; --accent-ink:#06202B; --accent-soft:#123244;
  --code-bg:#0E1722;
  --s-AVAILABLE-bg:#1F2C3C; --s-AVAILABLE-fg:#B4C2D6; --s-AVAILABLE-solid:#6B7C93;
  --s-BLOCKED-bg:#3A1D1F;   --s-BLOCKED-fg:#FFA39B;   --s-BLOCKED-solid:#F0706A;
  --s-CLAIMED-bg:#2A2347;   --s-CLAIMED-fg:#C6B5FF;   --s-CLAIMED-solid:#9A82F0;
  --s-IN_PROGRESS-bg:#16304D; --s-IN_PROGRESS-fg:#92C8FF; --s-IN_PROGRESS-solid:#4D9BEA;
  --s-REVIEW-bg:#3B2E12;    --s-REVIEW-fg:#F4CB74;    --s-REVIEW-solid:#E8B341;
  --s-COMPLETED-bg:#123424; --s-COMPLETED-fg:#84D9A6; --s-COMPLETED-solid:#46C07F;
  --p-Critical:#F0706A; --p-High:#F0A04B; --p-Medium:#6BAAF0; --p-Low:#6B7C93;
  --shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--f-body);margin:0;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.4vw,36px)}
h2{font-size:19px}
h3{font-size:15px;letter-spacing:0}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
code,.mono{font-family:var(--f-mono);font-size:.88em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:500 11.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;max-width:1280px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;display:flex;flex-direction:column;gap:22px;padding-block:28px;min-width:0}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .tag{font:500 12px/1 var(--f-mono);color:var(--accent);letter-spacing:.08em}
.brand b{font:700 21px/1.1 var(--f-display);letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12.5px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg);padding:8px 10px;border-radius:6px;font-weight:500;font-size:14.5px}
#nav a:hover{background:var(--surface);text-decoration:none}
#nav a[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
#nav a .cnt{font:500 12px var(--f-mono);color:var(--muted)}
.who{display:flex;flex-direction:column;gap:6px}
.who label{font-size:12.5px;color:var(--muted)}
.field{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.field:disabled{opacity:.6}
textarea.field{resize:vertical;min-height:88px}
.sync{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin-top:auto}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--s-AVAILABLE-solid);flex:none;margin-top:6px}
.sync.shared i{background:var(--s-COMPLETED-solid)}
.sync.local i,.sync.warn i{background:var(--s-REVIEW-solid)}

main{padding-block:28px 72px;min-width:0;display:flex;flex-direction:column;gap:36px}
.pagehead{display:flex;flex-direction:column;gap:8px}
.pagehead p{color:var(--muted);max-width:68ch}
.section{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:18px;min-width:0}
.section>header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px}

/* chips and badges */
.st{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-body);padding:5px 9px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-AVAILABLE{background:var(--s-AVAILABLE-bg);color:var(--s-AVAILABLE-fg)}
.s-WAITING,.s-BLOCKED{background:var(--s-BLOCKED-bg);color:var(--s-BLOCKED-fg)}
.s-CLAIMED{background:var(--s-CLAIMED-bg);color:var(--s-CLAIMED-fg)}
.s-IN_PROGRESS{background:var(--s-IN_PROGRESS-bg);color:var(--s-IN_PROGRESS-fg)}
.s-REVIEW{background:var(--s-REVIEW-bg);color:var(--s-REVIEW-fg)}
.s-COMPLETED{background:var(--s-COMPLETED-bg);color:var(--s-COMPLETED-fg)}
.pri{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.pri::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--p-Low);transform:rotate(45deg)}
.pri-Critical::before{background:var(--p-Critical)}.pri-High::before{background:var(--p-High)}.pri-Medium::before{background:var(--p-Medium)}
.tagx{font:500 11.5px/1 var(--f-mono);padding:4px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.tagx.hot{color:var(--accent);border-color:var(--accent)}
.mid{font:500 12.5px/1 var(--f-mono);color:var(--muted)}
.mchip{display:inline-flex;align-items:center;justify-content:center;font:500 12px/1 var(--f-mono);padding:6px 7px;border-radius:5px;border:1px solid transparent;color:var(--fg)}
.mchip:hover{text-decoration:none;filter:brightness(.96)}
.mchip.s-AVAILABLE{background:transparent;border-color:var(--line);color:var(--fg)}
.mchip.s-WAITING{background:transparent;border:1px dashed var(--s-BLOCKED-solid);color:var(--s-BLOCKED-fg)}
.mchip.s-BLOCKED{border-color:var(--s-BLOCKED-solid)}
.mchip.s-COMPLETED{background:var(--s-COMPLETED-solid);color:#fff}
.mchip.s-COMPLETED::after{content:" ✓";white-space:pre}
[data-theme="dark"] .mchip.s-COMPLETED{color:#06210F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mchip.s-COMPLETED{color:#06210F}}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.bar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:48px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;background:transparent}
.stack>i{display:block;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* dashboard */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-block:1px solid var(--line)}
.fig{padding:16px 18px 16px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig+.fig{padding-left:18px;border-left:1px solid var(--line)}
.fig b{font:700 34px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.fig b small{font-size:16px;color:var(--muted);font-weight:500}
.fig span{color:var(--muted);font-size:13px}
.pipeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 22px}
.stage{display:flex;flex-direction:column;gap:9px;min-width:0}
.stage .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stage .top b{font:600 14px/1.2 var(--f-display)}
.stage .top span{font:500 12px var(--f-mono);color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);color:var(--fg)}
.li:last-child{border-bottom:0}
a.li:hover{text-decoration:none;background:var(--surface);}
.li .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.li .sub{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0;max-width:56ch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 11.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.tablewrap{overflow-x:auto}
.act{display:flex;flex-direction:column}
.act li{padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.act li time{font:400 12px var(--f-mono);color:var(--muted);flex:none;min-width:84px}

/* module list */
.filters{display:grid;grid-template-columns:minmax(180px,2fr) repeat(4,minmax(110px,1fr));gap:10px;align-items:center}
.filters label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);white-space:nowrap}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) 92px 70px 150px 120px 90px;gap:10px 14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2);color:var(--fg)}
.row:hover{background:var(--surface);text-decoration:none}
.row .nm b{font-weight:600;display:block;overflow-wrap:anywhere}
.row .nm small{color:var(--muted);font-size:12.5px}
.row .who2{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.rowhead{font:500 11.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-block:8px}
.rowhead:hover{background:transparent}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col>h3{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.col>h3 .st{font-size:12.5px}
.col>h3 span.n{font:500 12px var(--f-mono);color:var(--muted)}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--fg)}
.card:hover{text-decoration:none;border-color:var(--accent)}
.card .t{font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.card .who2{font-size:12.5px;color:var(--muted)}

/* detail */
.crumbs{font-size:13.5px}
.dhead{display:flex;flex-direction:column;gap:12px}
.dhead .row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:40px;align-items:start}
.dmain{display:flex;flex-direction:column;gap:30px;min-width:0}
.dside{position:sticky;top:20px;display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.dside .blk{display:flex;flex-direction:column;gap:8px}
.dside label,.lbl{font:500 11.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:8px 10px;cursor:pointer;font-weight:500;font-size:14px;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{box-shadow:inset 0 0 0 2px var(--accent);border-color:var(--accent)}
.btn.small{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--s-BLOCKED-fg)}
.notice{font-size:13px;color:var(--s-REVIEW-fg);background:var(--s-REVIEW-bg);border-radius:6px;padding:8px 10px}
.notice.bad{color:var(--s-BLOCKED-fg);background:var(--s-BLOCKED-bg)}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:17px;height:17px;margin-top:3px;accent-color:var(--accent)}
.check.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.bul li{position:relative;padding:5px 0 5px 18px}
.bul li::before{content:"";position:absolute;left:3px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.facts dt{color:var(--muted)}.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line2);border-radius:8px;padding:14px;overflow-x:auto;font:400 13px/1.6 var(--f-mono);position:relative}
.codewrap{position:relative}
.codewrap .btn{position:absolute;top:8px;right:8px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.flow>div{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.flow p{font-size:13px;color:var(--muted)}
.prio{display:grid;grid-template-columns:90px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:13.5px}
.p-item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.p-item:last-child{border-bottom:0}
.p-item b{font-weight:600}
.sev{font:500 11.5px var(--f-mono)}
.sev.high{color:var(--p-Critical)}.sev.med{color:var(--p-High)}.sev.low{color:var(--muted)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:min(92vw,520px);z-index:50}
#toast.show{opacity:1}

@media (max-width:1020px){
  .row{grid-template-columns:52px minmax(0,1fr) 120px 90px;grid-template-areas:"id nm st pr" "id nm who bar"}
  .row>*{grid-area:auto}
  .row .c-id{grid-area:id}.row .nm{grid-area:nm}.row .c-st{grid-area:st}.row .c-pri{grid-area:pr}.row .who2{grid-area:who}.row .c-bar{grid-area:bar}
  .row .c-diff,.row .c-deps{display:none}
  .rowhead{display:none}
  .filters{grid-template-columns:1fr 1fr}
  .filters .q{grid-column:1/-1}
  .detail{grid-template-columns:minmax(0,1fr)}
  .dside{position:static;order:-1}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:static;height:auto;padding-block:20px 8px;gap:14px}
  #nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  #nav a{border:1px solid var(--line);padding:6px 10px}
  .sync{margin-top:0}
  .cols{grid-template-columns:minmax(0,1fr);gap:30px}
  main{padding-top:14px}
}
@media (max-width:520px){
  .fig+.fig{border-left:0;padding-left:0}
  .fig{padding-right:8px}
  .figs{grid-template-columns:1fr 1fr}
  .prio{grid-template-columns:78px minmax(0,1fr) 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";
/* ============================================================
   Static roadmap definition (from the repository audit).
   Only progress state (status, owner, ticks, notes) is stored.
   ============================================================ */
const STAGES=["Foundations","Understanding","Methodology","Features","Models","Optimise and analyse","Delivery"];
const STATUS_LABEL={AVAILABLE:"Available",WAITING:"Waiting on dependencies",CLAIMED:"Claimed",IN_PROGRESS:"In progress",REVIEW:"In review",COMPLETED:"Completed",BLOCKED:"Blocked"};
const STATUS_ORDER=["COMPLETED","REVIEW","IN_PROGRESS","CLAIMED","AVAILABLE","WAITING","BLOCKED"];
const PRI_RANK={Critical:0,High:1,Medium:2,Low:3};

const B00=["Load and merge 8 CSV files (2,830,743 rows by 79 columns)","Clean v1: infinities to NaN, 12 near-constant columns dropped, 2,867 NaN rows removed","Label encoding for 15 classes, with an assertion in the notebook","Stratified split and scaling fitted on train only","RF importances, mutual information, PCA (15 components) and LDA (1 component)","Five classifiers trained and compared in the notebook"];

const byId=Object.fromEntries(MODS.map(m=>[m.id,m]));

   State and storage
   ============================================================ */
let S={};            // module id -> state doc {status, assignee, pr, notes, done:{}, prev, blocker, updatedAt, updatedBy}
let ACT=[];          // activity items newest first
let db=null, userNs=null, mode="connecting", syncWarn=false, readOnly=false;

try{me.name=localStorage.getItem("cs24.name")||"";}catch(e){}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const main=$("#main");

function st(m){return (S[m.id]&&S[m.id].status)||"AVAILABLE";}
function unmet(m){return m.deps.filter(d=>st(byId[d])!=="COMPLETED");}
function eff(m){const s=st(m);return s==="AVAILABLE"&&unmet(m).length?"WAITING":s;}
function doneKeys(m){const d=(S[m.id]&&S[m.id].done)||{};const valid=new Set([...m.steps.map((_,i)=>"s"+i),...m.done.map((_,i)=>"a"+i)]);return Object.keys(d).filter(k=>d[k]&&valid.has(k));}
function total(m){return m.steps.length+m.done.length;}
function prog(m){return st(m)==="COMPLETED"?1:doneKeys(m).length/total(m);}
function critDone(m){const d=(S[m.id]&&S[m.id].done)||{};return m.done.every((_,i)=>d["a"+i]);}
function owner(m){return (S[m.id]&&S[m.id].assignee)||"";}
function slugBranch(m){return "feature/"+m.id+"-"+m.slug;}
function pct(x){return Math.round(x*100);}
function ago(t){if(!t)return"";const s=(Date.now()-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";return Math.floor(s/86400)+" d ago";}
function chip(k){return `<span class="st s-${k}">${STATUS_LABEL[k]}</span>`;}
function priTag(p){return `<span class="pri pri-${p}">${p}</span>`;}
function mchip(m){const k=eff(m);return `<a class="mchip s-${k}" href="#module-${m.id.toLowerCase()}" title="${esc(m.id+" "+m.name+": "+STATUS_LABEL[k])}">${m.id}</a>`;}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),3200);}
function deepMerge(a,b){const o={...a};for(const k in b){o[k]=(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k]))?deepMerge(a[k]||{},b[k]):b[k];}return o;}
function lsSave(){try{localStorage.setItem("cs24.local",JSON.stringify({S,ACT}));}catch(e){}}
function lsLoad(){try{const j=JSON.parse(localStorage.getItem("cs24.local")||"null");if(j){S=j.S||{};ACT=j.ACT||[];}}catch(e){}}

function handleErr(e){
  if(e&&e.code==="invalid_argument"){readOnly=true;toast("You can view this tracker but not change it. Ask the owner for Contributor access.");}
  else toast("Could not save that change. Try again in a moment.");
  render();
}
function logAct(mod,text){
  const item={t:Date.now(),who:me.name||"Someone",mod,text};
  if(mode==="shared"&&db){db.collection("activity").add(item).catch(()=>{});}
  else{ACT.unshift(item);ACT=ACT.slice(0,60);lsSave();}
}
function write(id,patch,activity){
  patch={...patch,updatedAt:Date.now(),updatedBy:me.name||"Someone"};
  if(activity)logAct(id,activity);
  if(mode==="shared"&&db){
    queue[id]=(queue[id]||Promise.resolve()).then(async()=>{
      const ref=db.doc("modules/"+id);
      try{if(known.has(id)||S[id])await ref.update(patch);else await ref.set(patch);known.add(id);}
      catch(e){handleErr(e);}
    });
  }else{
    S[id]=deepMerge(S[id]||{},patch);lsSave();render();
  }
}

/* ============================================================
   Actions
   ============================================================ */
function needName(){if(me.name)return false;toast("Type your name in the left column first.");const i=$("#me");i.focus();return true;}
function claim(m){
  if(readOnly)return toast("View-only access.");
  if(needName())return;
  if(unmet(m).length)return toast("Finish "+unmet(m).join(", ")+" first, or ask the owner of that module.");
  write(m.id,{status:"CLAIMED",assignee:me.name,blocker:""},"claimed "+m.id);
}
function setStatus(m,ns){
  if(readOnly)return toast("View-only access.");
  const cur=st(m);if(cur===ns)return;
  if(ns==="AVAILABLE"){return write(m.id,{status:"AVAILABLE",assignee:"",blocker:""},"released "+m.id);}
  if(!owner(m)&&ns!=="BLOCKED"){if(needName())return;}
  if(ns==="COMPLETED"&&!critDone(m))return toast("Tick every acceptance criterion before completing "+m.id+".");
  const patch={status:ns};
  if(!owner(m)&&ns!=="BLOCKED")patch.assignee=me.name;
  if(ns==="BLOCKED")patch.prev=cur;
  if(cur==="BLOCKED")patch.blocker="";
  write(m.id,patch,({CLAIMED:"claimed",IN_PROGRESS:"started work on",REVIEW:"sent for review:",COMPLETED:"completed",BLOCKED:"marked blocked:"}[ns]||"updated")+" "+m.id);
}
function unblock(m){const p=(S[m.id]&&S[m.id].prev)||"IN_PROGRESS";write(m.id,{status:p,blocker:""},"unblocked "+m.id);}

async function copyText(text,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true;}catch(e){
    try{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove();}catch(e2){}
  }
  if(btn){const o=btn.textContent;btn.textContent=ok?"Copied":"Select and copy";setTimeout(()=>btn.textContent=o,1600);}
}
function boardMarkdown(){
  let t="| ID | Module | Status | Priority | Difficulty | Dependencies | Assigned To |\n|---|---|---|---|---|---|---|\n";
  MODS.forEach(m=>{t+=`| ${m.id} | ${m.name} | ${eff(m)==="WAITING"?"BLOCKED":st(m)} | ${m.pri} | ${m.diff} | ${m.deps.join(", ")||"-"} | ${owner(m)||"unassigned"} |\n`;});
  return t;
}

  return `
  <div class="dhead"><a class="crumbs" href="#modules">← All modules</a>
    <div class="row1"><span class="mid" style="font-size:14px">${m.id}</span>${chip(k)}${priTag(m.pri)}<span class="tagx">${m.diff}</span><span class="tagx">${STAGES[m.stage]}</span><span class="tagx">${m.kind==="OPTIONAL"?"Optional":m.kind==="MISSING"?"New module":"Improve existing"}</span>${m.rec?`<span class="tagx hot">${esc(m.rec)}</span>`:""}</div>
    <h1>${esc(m.name)}</h1><p class="muted" style="max-width:70ch">${esc(m.obj)}</p></div>
  <div class="detail">
   <div class="dmain">
    <section class="section"><h2>Why it is needed</h2><p style="max-width:72ch">${esc(m.why)}</p></section>
    <section class="section"><header><h2>What to do</h2><span class="muted num" style="font-size:13px">${m.steps.filter((_,i)=>d["s"+i]).length}/${m.steps.length}</span></header>
      <div>${m.steps.map((t,i)=>chk(m,"s"+i,t,!!d["s"+i])).join("")}</div></section>
    <section class="section"><header><h2>Acceptance criteria</h2><span class="muted num" style="font-size:13px">${m.done.filter((_,i)=>d["a"+i]).length}/${m.done.length}</span></header>
      <div>${m.done.map((t,i)=>chk(m,"a"+i,t,!!d["a"+i])).join("")}</div></section>
    <section class="section"><h2>Tests required</h2><ul class="bul">${m.tests.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>
    <section class="section"><h2>Files</h2><div class="chips">${m.files.map(f=>`<code class="tagx">${esc(f)}</code>`).join("")}</div></section>
    <section class="section"><h2>Dependencies</h2>
      <dl class="facts"><dt>Needs</dt><dd>${m.deps.length?`<span class="chips">${m.deps.map(x=>mchip(byId[x])).join("")}</span>`:"Nothing. It can start now."}</dd>
      <dt>Unlocks</dt><dd>${(dependents[m.id]||[]).length?`<span class="chips">${dependents[m.id].map(x=>mchip(byId[x])).join("")}</span>`:"No other module depends on it."}</dd>
      <dt>Fixes</dt><dd>${m.fixes.length?`<span class="chips">${m.fixes.map(f=>`<a class="tagx" href="#findings" title="${esc((FINDINGS.find(x=>x.id===f)||{}).t||"")}">${f}</a>`).join("")}</span> ${m.fixes.map(f=>esc((FINDINGS.find(x=>x.id===f)||{}).t||"")).join("; ")}`:"No audit finding is tied to it."}</dd></dl></section>
    <section class="section"><h2>Git commands</h2><div class="codewrap"><pre id="git-${m.id}">${esc(gitBlock(m))}</pre><button class="btn small" data-act="copy-git">Copy</button></div></section>
   </div>
   <aside class="dside" aria-label="Ownership and progress">
     ${readOnly?`<div class="notice bad">View-only access. You can read this module but not change it.</div>`:""}
     <div class="blk"><label>Progress</label><div style="display:flex;align-items:baseline;justify-content:space-between"><b style="font:700 30px var(--f-display)" class="num">${pct(prog(m))}%</b><span class="muted num" style="font-size:13px">${doneKeys(m).length}/${total(m)} items</span></div><div class="bar"><i style="width:${pct(prog(m))}%"></i></div></div>
     ${ownerBlock}
     <div class="blk"><label for="d-pr">Pull request link</label><input id="d-pr" class="field" data-field="pr" value="${esc(s.pr||"")}" placeholder="https://github.com/…/pull/12" ${dis}>${/^https?:\/\//.test(s.pr||"")?`<a href="${esc(s.pr)}" target="_blank" rel="noopener">Open pull request</a>`:""}</div>
     <div class="blk"><label for="d-notes">Notes for the team</label><textarea id="d-notes" class="field" data-field="notes" placeholder="Decisions, open questions, what the reviewer should look at" ${dis}>${esc(s.notes||"")}</textarea></div>
     <div class="blk"><label>Branch</label><code style="overflow-wrap:anywhere">${esc(slugBranch(m))}</code></div>
     ${s.updatedAt?`<p class="muted" style="font-size:12.5px">Last change ${ago(s.updatedAt)} by ${esc(s.updatedBy||"someone")}.</p>`:""}
   </aside>
  </div>`;
}

function vWorkflow(){
  const code=(t,id)=>`<div class="codewrap"><pre id="${id}">${esc(t)}</pre><button class="btn small" data-act="copy-pre" data-t="${id}">Copy</button></div>`;
  return `<div class="pagehead"><span class="eyebrow">Workflow</span><h1>How a module goes from claim to merge</h1><p>Rules we agreed for the repository. A module has one owner at a time; the M11 to M16 classifiers are separate modules, so they can be worked on in parallel by different people.</p></div>
  <section class="section"><h2>Status lifecycle</h2>
   <div class="flow">
    <div>${chip("AVAILABLE")}<p>Free to take. Dependencies are completed.</p></div>
    <div>${chip("CLAIMED")}<p>One person owns it and created the branch.</p></div>
    <div>${chip("IN_PROGRESS")}<p>Code and tests are being written.</p></div>
    <div>${chip("REVIEW")}<p>Pull request open. Someone else checks the criteria.</p></div>
    <div>${chip("COMPLETED")}<p>Merged into main with every criterion ticked.</p></div>
    <div>${chip("BLOCKED")}<p>Waiting on something outside the owner's control.</p></div>
   </div></section>
  <div class="cols">
   <section class="section"><h2>Branches and commits</h2>
    <ul class="bul"><li><b>main</b> is protected. Only reviewed, working code goes in.</li><li>Feature branches: <code>feature/M03-label-encoding</code>. Fixes: <code>fix/short-description</code>.</li><li>Branch from the latest main. Keep commits small.</li><li>Commit message format: <code>M10: add per-class recall and PR-AUC</code>.</li><li>Squash-merge after one approving review.</li></ul>
    ${code(`git switch main && git pull\ngit switch -c feature/M03-label-encoding\ngit add -A\ngit commit -m "M03: attack is 1 in all label tasks"\ngit push -u origin feature/M03-label-encoding`,"wf-git")}
   </section>
   <section class="section"><h2>Before you open the pull request</h2>
    <ul class="bul"><li>Every step and acceptance criterion on the module page is ticked.</li><li>pytest passes locally (once M25 exists).</li><li>Notebook outputs are stripped (nbstripout).</li><li>You changed only your module's files, plus your own rows in ROADMAP.md.</li><li>The pull request link is pasted on the module page and status is set to In review.</li></ul>
    <p class="muted" style="font-size:13.5px">The reviewer ticks nothing for you. They read the criteria, run the code, then you or they set Completed.</p>
   </section>
   <section class="section"><h2>Files that cause merge conflicts</h2>
    <div class="tablewrap"><table><thead><tr><th>File</th><th>Rule</th></tr></thead><tbody>
     <tr><td><code>requirements.txt</code></td><td>Append lines only.</td></tr>
     <tr><td><code>src/config.py</code>, <code>configs/default.yaml</code></td><td>Add keys in your own section.</td></tr>
     <tr><td><code>src/models.py</code></td><td>One function per model; do not edit someone else's.</td></tr>
     <tr><td>Notebooks</td><td>Strip outputs; one notebook per module.</td></tr>
     <tr><td><code>README.md</code>, <code>ROADMAP.md</code></td><td>Edit your own row or section only.</td></tr></tbody></table></div>
   </section>
   <section class="section"><h2>Keep ROADMAP.md in the repository</h2>
    <p class="muted">This page is the live board. To keep a copy in Git, paste the table below into ROADMAP.md at milestones.</p>
    <button class="btn" data-act="copy-md" style="align-self:flex-start">Copy current board as Markdown</button>
   </section>
  </div>`;
}

function vFindings(){
  return `<div class="pagehead"><span class="eyebrow">Findings</span><h1>What the audit found</h1><p>Sixteen issues in the current repository and notebook, each tied to the modules that fix it. Results below come from the notebook's saved outputs, not from a new run.</p></div>
  <div class="cols">
   <section class="section"><h2>Notebook results on the test set</h2>
    <p class="muted" style="font-size:13.5px">All models use a single LDA axis. 'Attack recall' is the share of real attacks detected (class 0 in the notebook).</p>
    <div class="tablewrap"><table><thead><tr><th>Model</th><th>Accuracy</th><th>Attack recall</th></tr></thead><tbody>${BASELINE.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted" style="font-size:13.5px">About 80% of flows are benign, so 0.803 accuracy needs no model at all.</p></section>
   <section class="section"><h2>Already done (baseline)</h2><ul class="bul">${B00.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <p class="muted" style="font-size:13.5px">These stay. The modules reuse and extend them instead of rebuilding.</p></section>
  </div>
  <section class="section"><h2>Issues</h2><div>${FINDINGS.map(f=>`<div class="p-item"><span class="sev ${f.sev}">${f.id}</span><div><b>${esc(f.t)}</b><p class="muted" style="font-size:14px">${esc(f.e)}</p><div class="chips" style="margin-top:8px">${f.m.map(x=>mchip(byId[x])).join("")}</div></div></div>`).join("")}</div></section>`;
}

/* ============================================================
   Render loop
   ============================================================ */
function editing(){const a=document.activeElement;return a&&main.contains(a)&&(a.tagName==="TEXTAREA"||a.tagName==="SELECT"||(a.tagName==="INPUT"&&a.type!=="checkbox"));}
function render(){
  renderNav();
  if(editing()){dirty=true;return;}
  dirty=false;
  const r=route();
  main.innerHTML=r.v==="dashboard"?vDashboard():r.v==="board"?vBoard():r.v==="modules"?vModules():r.v==="workflow"?vWorkflow():r.v==="findings"?vFindings():vDetail(r.m);
}
window.addEventListener("hashchange",()=>{dirty=false;document.activeElement&&document.activeElement.blur&&document.activeElement.blur();render();window.scrollTo(0,0);});
document.addEventListener("focusout",()=>{if(dirty)setTimeout(render,50);});

main.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const r=route();const act=b.dataset.act;
  if(act==="claim"&&r.m)claim(r.m);
  else if(act==="status"&&r.m)setStatus(r.m,b.dataset.v);
  else if(act==="unblock"&&r.m)unblock(r.m);
  else if(act==="copy-md")copyText(boardMarkdown(),b);
  else if(act==="copy-git"&&r.m)copyText(gitBlock(r.m),b);
  else if(act==="copy-pre"){const el=document.getElementById(b.dataset.t);copyText(el?el.textContent:"",b);}
});
main.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="f-stage"){F.stage=t.value;return refreshList();}
  if(t.id==="f-pri"){F.pri=t.value;return refreshList();}
  if(t.id==="f-status"){F.status=t.value;return refreshList();}
  if(t.id==="f-who"){F.who=t.value;return refreshList();}
  if(t.id==="f-done"){F.hideDone=t.checked;return refreshList();}
  const r=route();if(!r.m||readOnly)return;
  if(t.dataset.key){write(r.m.id,{done:{[t.dataset.key]:t.checked}});if(!t.checked&&st(r.m)==="COMPLETED"){/* unticking a criterion on a completed module reopens review */write(r.m.id,{status:"REVIEW"},"reopened "+r.m.id+" for review");}}
  else if(t.dataset.field){const v=t.value.trim();if(t.dataset.field==="pr"&&v&&!/^https?:\/\//.test(v))return toast("Paste a full link starting with https://");write(r.m.id,{[t.dataset.field]:v},t.dataset.field==="pr"&&v?"attached a pull request to "+r.m.id:null);}
});
main.addEventListener("input",e=>{if(e.target.id==="f-q"){F.q=e.target.value;refreshList();}});
function refreshList(){const l=$("#list");if(l)l.innerHTML=listHTML();}
$("#me").value=me.name;
$("#me").addEventListener("change",e=>{me.name=e.target.value.trim();try{localStorage.setItem("cs24.name",me.name);}catch(x){}toast(me.name?"Name saved. New claims will be assigned to you.":"Name cleared.");});

/* ============================================================
   Connect to shared storage
   ============================================================ */
(async function init(){
  render();
  const c=window.claude;
  if(c&&c.use){
    try{userNs=await c.use("user");}catch(e){}
    try{db=await c.use("db");}catch(e){}
  }
  if(userNs){
    try{
      const v=await userNs.me();
      if(!me.name&&v&&v.name){me.name=v.name;$("#me").value=me.name;try{localStorage.setItem("cs24.name",me.name);}catch(e){}}
      if((await userNs.can("data.write"))===false)readOnly=true;
    }catch(e){}
  }
  if(!db){mode="local";lsLoad();render();return;}
  mode="shared";
  let timer=setTimeout(()=>{syncWarn=true;render();},10000);
  const fresh=snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);if(syncWarn){syncWarn=false;}}};
  try{
    db.collection("modules").onSnapshot(snap=>{
      const next={};snap.docs.forEach(d=>{next[d.id]=d.data();known.add(d.id);});S=next;fresh(snap);render();
    },e=>{clearTimeout(timer);syncWarn=true;if(e&&e.code==="revoked")readOnly=true;render();});
    db.collection("activity").orderBy("t","desc").limit(25).onSnapshot(snap=>{
      ACT=snap.docs.map(d=>d.data());render();
    },()=>{});
  }catch(e){mode="local";lsLoad();render();}
  render();
})();
</script>
